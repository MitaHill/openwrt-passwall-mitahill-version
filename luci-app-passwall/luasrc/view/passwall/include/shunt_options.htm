<style>
.hidden {
	display: none !important;
	visibility: hidden !important;
}
</style>
<script type="text/javascript">
	//<![CDATA[
	const normal_list = JSON.parse('<%=self.normal_list%>');
	function check_fakedns(id, val) {
		const dom_id = "cbid.table." + id + ".";
		const fakedns_dom = document.getElementById(dom_id + "_fakedns");
		if (!val) {
			const selectNode = document.getElementById(dom_id + "_node");
			val = selectNode.value;
		}
		if (val == "" || val == "_direct") {
			fakedns_dom.value = 0;
			fakedns_dom.checked = false;
			fakedns_dom.classList.add('hidden');
		} else {
			fakedns_dom.classList.remove('hidden');
		}
	}
	function check_proxy_tag(id, val) {
		const dom_id = "cbid.table." + id + ".";
		const cbid = dom_id + "_proxy_tag";
		const proxy_tag_dom = document.getElementById(cbid + ".main");
		if (!val) {
			const selectNode = document.getElementById(dom_id + "_node");
			val = selectNode.value;
		}
		if (val == "" || val.startsWith("_") || val.startsWith("Socks_") || !normal_list.find(element => element.id == val)) {
			const hiddenSelect = document.getElementById(cbid);
			const panel = document.getElementById(cbid + ".panel");
			const display = document.getElementById(cbid + ".display");
			const labelSpan = document.getElementById(cbid + ".label");
			const searchInput = document.getElementById(cbid + ".search");
			const listContainer = document.getElementById(cbid + ".list");
			lv_change(cbid, listContainer, hiddenSelect, labelSpan, searchInput, "", "<%:Close (Not use)%>");
			proxy_tag_dom.classList.add('hidden');
		} else {
			proxy_tag_dom.classList.remove('hidden');
		}
	}
	function row_control(row, name) {
		if (!row) return null;
		return row.querySelector('[id$=".' + name + '"], [name$=".' + name + '"]');
	}
	function row_option_main(row, name) {
		if (!row) return null;
		return row.querySelector('[id$=".' + name + '.main"]');
	}
	function option_cell(row, name) {
		const field = row_control(row, name);
		const main = row_option_main(row, name);
		return (field && field.closest("td")) || (main && main.closest("td")) || main || field;
	}
	function set_dns_option_state(row, name, hide) {
		const cell = option_cell(row, name);
		if (cell) {
			if (hide) cell.classList.add("hidden");
			else cell.classList.remove("hidden");
		}
		[row_control(row, name), row_option_main(row, name)].forEach(function(el) {
			if (el && typeof el.disabled !== "undefined") {
				el.disabled = hide;
			}
		});
	}
	function check_dns_options(id, row) {
		row = row || get_shunt_row(id);
		const global = row_control(row, "_dns_global");
		if (!global) return;
		const hide = global.checked;
		["_dns_protocol", "_dns_strategy", "_dns_server"].forEach(function(name) {
			set_dns_option_state(row, name, hide);
		});
		// 勾选全局 DNS 时隐藏并禁用本规则 DNS 自定义项。
	}
	function hide_default_dns_options(id, row) {
		row = row || get_shunt_row(id);
		["_dns_global", "_dns_protocol", "_dns_strategy", "_dns_server"].forEach(function(name) {
			set_dns_option_state(row, name, true);
		});
	}
	function get_shunt_row(id) {
		const table_dom = document.getElementById("cbi-passwall-shunt_option_list");
		return table_dom ? table_dom.getElementsByTagName("tr")[id] : null;
	}
	function refresh_depends() {
		const table_dom = document.getElementById("cbi-passwall-shunt_option_list");
		if (table_dom) {
			const trs = table_dom.getElementsByTagName("tr");
			for (let i = 1; i < trs.length;i++) {
				check_fakedns(i);
				check_proxy_tag(i);
				check_dns_options(i, trs[i]);
			}
		}
	}
	document.addEventListener("DOMContentLoaded", () => setTimeout(() => {
		refresh_depends();
		const table_dom = document.getElementById("cbi-passwall-shunt_option_list");
		if (table_dom) {
			const trs = table_dom.getElementsByTagName("tr");
			for (let i = 1; i < trs.length;i++) {
				const selectNode = document.getElementById("cbid.table." + i + "._node.main");
				selectNode.addEventListener("change", function(el){
					let new_val = el.target.value
					check_fakedns(i, new_val);
					check_proxy_tag(i, new_val);
				});
				const dnsGlobal = row_control(trs[i], "_dns_global");
				if (dnsGlobal) {
					["click", "change"].forEach(function(eventName) {
						dnsGlobal.addEventListener(eventName, function() {
							check_dns_options(i, trs[i]);
							setTimeout(function() {
								check_dns_options(i, trs[i]);
							}, 0);
						});
					});
				}
				if (i == trs.length - 1) {
					// Default 行不展示独立 DNS 配置。
					hide_default_dns_options(i, trs[i]);
					const newArray = window.lv_dropdown_data["cbid.table." + i + "._node"].ungrouped.filter(item => item.key !== "_default");
					window.lv_dropdown_data["cbid.table." + i + "._node"].ungrouped = newArray
				}
			}
		}
	}, 100));
	//]]>
</script>
